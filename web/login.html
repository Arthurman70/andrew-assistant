<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrew · Sign in</title><style>body{background:#101b23;color:#f3f7f1;font:17px system-ui;margin:0;display:grid;place-items:center;min-height:100dvh}main{max-width:360px;width:85%;padding:30px;background:#1b2e35;border-radius:24px}input,button{box-sizing:border-box;width:100%;font:inherit;margin:9px 0;padding:13px;border-radius:10px;border:1px solid #73958c}button{background:#b9efd2;color:#173327;cursor:pointer}p{line-height:1.5}label{display:block}</style><meta name="andrew-csrf" content="{{csrf}}"></head><body><main><h1>Welcome to Andrew</h1><p>Your assistant, wherever you are.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>Sign in</button></form><p id="error" role="alert"></p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=e.target;f.querySelector('button').disabled=true;try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Andrew-CSRF':document.querySelector('meta[name=andrew-csrf]').content},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json();if(!r.ok)throw Error(j.error);location.reload()}catch(x){document.getElementById('error').textContent=x.message;f.querySelector('button').disabled=false}};</script></body></html>
