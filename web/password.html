<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrew · Choose your password</title><style>body{background:#101b23;color:#f3f7f1;font:17px system-ui;margin:0;display:grid;place-items:center;min-height:100dvh}main{max-width:380px;width:85%;padding:30px;background:#1b2e35;border-radius:24px}input,button{width:100%;box-sizing:border-box;font:inherit;margin:10px 0;padding:12px;border-radius:10px}button{background:#b9efd2;color:#173327;border:0}label{display:block}</style></head><body><main><h1>Make Andrew yours</h1><p>Replace the temporary password before using your assistant.</p><form id="password"><label>Temporary password<input name="current" type="password" autocomplete="current-password" required></label><label>New password (at least 12 characters)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required></label><button>Save and open Andrew</button></form><p id="error" role="alert"></p></main><script>document.getElementById('password').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.password!==data.confirm){document.getElementById('error').textContent='The new passwords do not match.';return}try{const r=await fetch('/auth/password',{method:'POST',headers:{'Content-Type':'application/json','X-Andrew-CSRF':document.querySelector('meta[name=andrew-csrf]').content},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);location.reload()}catch(x){document.getElementById('error').textContent=x.message}};</script></body></html>
