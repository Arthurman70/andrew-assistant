<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrew</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 35% 40%,#274449,#10191f 65%);color:#edf6f4;font:20px system-ui;padding:4vh 5vw}header{display:flex;justify-content:space-between;color:#a9cfc6;font-size:16px}main{display:grid;grid-template-columns:42% 58%;align-items:center;min-height:65vh}#avatar{width:100%;height:48vh;object-fit:contain;transform-origin:50% 85%;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 18px 25px #0004)}#avatar.listening{animation:wiggle 1s ease-in-out infinite}#avatar.speaking{animation:talk .3s ease-in-out infinite}#clock{font-size:clamp(55px,9vw,110px);font-weight:250;letter-spacing:-4px}h1{font-size:32px;margin:12px 0}#status,#date,small{color:#abc0c5}#answer{min-height:55px;line-height:1.45;font-size:clamp(18px,2vw,27px)}button,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #48636c;background:#203c43;color:#edf6f4;margin:5px}button{cursor:pointer}input[type=text]{width:70%}input[type=range]{accent-color:#9debd3;vertical-align:middle;width:180px}#timers{display:flex;gap:12px;flex-wrap:wrap}.timer{padding:10px;background:#26544d;border-radius:12px}small{font-size:14px}footer{display:flex;align-items:center;gap:15px;flex-wrap:wrap}@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}@keyframes wiggle{50%{transform:rotate(-4deg) scale(1.025,.975)}}@keyframes talk{50%{transform:translateY(-6px) scale(1.045,.955)}}@media(prefers-reduced-motion:reduce){#avatar,#avatar.listening,#avatar.speaking{animation:none}}
</style><link rel="stylesheet" href="/assets/upgrade.css"><header><span id="date"></span><span id="cameraStatus">Camera off · Say Hey and my name to talk</span></header><main><div><img id="cameraPreview" hidden alt="Requested webcam preview" style="width:100%;border-radius:20px" onerror="this.hidden=true"><img id="avatar" src="/assets/andrew.png" alt="A fuzzy friendly Andrew"></div><div><div id="clock"></div><h1 id="name">Andrew</h1><p id="status">Connecting to PC…</p><p id="answer">Say “Andrew,” then your request.</p><div id="timers"></div></div></main><footer><button onclick="ask('turn on camera')">Camera preview</button><button onclick="ask('stop camera')">Camera off</button><button onclick="ask('take a photo')">Photo</button><button onclick="ask('record a video for ten seconds')">10-second video</button><button onclick="ask('send the latest photo')">Ask AI about photo</button><button onclick="ask('snooze for 30 minutes on the Pi')">Snooze 30 min</button><button id="wakeNow" onclick="ask('cancel snooze on the Pi')">Wake now</button><button onclick="ask('set a five minute timer')">5 minute timer</button><button onclick="ask('open browser')">Browser</button><button onclick="ask('open youtube')">YouTube</button><label>My voice <input id="volume" type="range" min="0" max="100" value="80" onchange="ask('set your volume to '+this.value+' percent')"><output id="volumeLabel">80%</output></label></footer><details><summary>Type a request</summary><form onsubmit="event.preventDefault();ask(document.getElementById('text').value)"><input id="text" type="text" aria-label="Request" placeholder="Ask anything"><button>Send</button></form></details><small>Grok conversations · Local name detection and voice · Replies play here</small><script>
const $=id=>document.getElementById(id);let lastAnswer=0;
function clock(){const n=new Date();$('clock').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}clock();setInterval(clock,1000);
async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error();const s=await r.json();if(window.renderUpgrade)window.renderUpgrade(s);const v=s.voice_sessions?.pi||{};$('name').textContent=s.name;const cam=s.camera||{};const preview=cam.preview_remaining>0;$('cameraStatus').textContent=preview?'Camera preview · '+Math.ceil(cam.preview_remaining)+'s':(s.pi_voice?.camera?.phase==='capturing'?'Camera capturing':'Camera off · Say Hey and my name to talk');$('avatar').hidden=preview;if(preview){$('cameraPreview').src='/api/camera-frame?t='+Date.now();$('cameraPreview').hidden=false}else{$('cameraPreview').hidden=true}const rest=s.listening?.pi?.remaining||0;$('wakeNow').disabled=!rest;$('status').textContent=rest?'Sleeping · '+Math.ceil(rest/60)+' min left · Timers still ring':s.provider+' · Say “'+(s.pi_voice?.wake_phrase||('Hey '+s.name))+'”';$('avatar').className=s.playback_active?'speaking':(s.pi_voice?.phase==='listening'?'listening':'');if(v.answered_at>lastAnswer){$('answer').textContent=v.last_answer;lastAnswer=v.answered_at}if(document.activeElement!==$('volume'))$('volume').value=s.pi_volume;$('volumeLabel').textContent=s.pi_volume+'%';$('timers').replaceChildren();for(const t of s.timers){const el=document.createElement('div');el.className='timer';el.textContent=t.name+' · '+(t.status==='ringing'?'Finished':Math.max(0,Math.round(t.due-Date.now()/1000))+'s');$('timers').append(el)}}catch(e){$('status').textContent='Waiting for PC connection'}}
async function ask(text){$('answer').textContent='Working…';try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','X-Andrew-Screen':'1'},body:JSON.stringify({text})});const j=await r.json();$('answer').textContent=j.answer||j.error}catch(e){$('answer').textContent='PC connection unavailable'}}refresh();setInterval(refresh,1000);
</script><script src="/assets/upgrade.js"></script><script src="/assets/weather.js"></script></html>
